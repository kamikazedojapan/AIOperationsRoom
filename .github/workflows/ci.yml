name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.115" "uvicorn>=0.30" "pytest>=8" "httpx>=0.27"
      - name: Run Python tests
        run: python -m pytest -q --basetemp=.test-temp

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend syntax
        run: node --check frontend/app.js
      - name: Run frontend tests
        run: node --test tests/js/pixel.test.js
